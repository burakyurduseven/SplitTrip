spring.application.name=splittrip-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splittrip}
spring.datasource.username=${DB_USERNAME:splittrip}
spring.datasource.password=${DB_PASSWORD:splittrip}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
splittrip.security.jwt-secret=${JWT_SECRET:c3BsaXR0cmlwLWRldmVsb3BtZW50LWp3dC1zZWNyZXQtY2hhbmdlLW1l}
splittrip.security.access-token-ttl=15m
splittrip.security.refresh-token-ttl=30d
splittrip.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
